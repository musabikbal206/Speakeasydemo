<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Linguist OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: { blue: '#007AFF', gray: '#8E8E93', bg: '#F2F2F7', darkbg: '#000000', card: '#ffffff', darkcard: '#1C1C1E' }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body, div, button { transition: all 0.3s ease; }
        
        /* Mic Active Animation */
        @keyframes glowing {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: glowing 1.5s infinite;
            background-color: #ef4444 !important; /* Red */
            border-color: #ef4444 !important;
        }

        /* AI Speaking Animation */
        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 40px; }
        }
        .ai-wave-bar { animation: wave 0.5s ease-in-out infinite; }
        .ai-wave-paused { animation: none; height: 5px; }
    </style>
</head>
<body class="bg-gray-900 h-screen w-screen flex items-center justify-center font-sans overflow-hidden select-none">

    <!-- PHONE DEVICE FRAME -->
    <div class="relative w-full h-full sm:w-[375px] sm:h-[812px] bg-ios-bg dark:bg-black sm:rounded-[45px] shadow-2xl overflow-hidden flex flex-col border-[6px] border-gray-800">
        
        <!-- TOP BAR -->
        <div class="h-12 w-full flex justify-between items-center px-6 text-xs font-bold z-50 text-black dark:text-white absolute top-0 bg-white/50 dark:bg-black/50 backdrop-blur-md">
            <span id="clock">12:00</span>
            <div class="flex gap-2 items-center">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-lg"></i>
            </div>
        </div>

        <!-- ======================= VIEWS ======================= -->

        <!-- 1. CONTACTS (HOME) -->
        <div id="view-contacts" class="view-section flex-1 pt-16 pb-20 overflow-y-auto no-scrollbar">
            <div class="px-5 mb-4">
                <h1 class="text-3xl font-bold text-black dark:text-white mb-2">Contacts</h1>
                <p class="text-gray-500 text-sm">Select a partner to call</p>
            </div>
            <div class="bg-white dark:bg-ios-darkcard mx-4 rounded-xl overflow-hidden shadow-sm divide-y divide-gray-100 dark:divide-gray-800" id="contact-list">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- 2. MESSAGES (HISTORY) -->
        <div id="view-messages" class="view-section hidden flex-1 pt-16 pb-20 overflow-y-auto no-scrollbar">
            <div class="px-5 mb-4 flex justify-between items-end">
                <h1 class="text-3xl font-bold text-black dark:text-white">Messages</h1>
                <button onclick="clearHistory()" class="text-ios-blue text-sm font-semibold">Clear</button>
            </div>
            <div id="messages-list" class="space-y-3 px-4 pb-4">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- 3. SETTINGS -->
        <div id="view-settings" class="view-section hidden flex-1 pt-16 pb-20 overflow-y-auto no-scrollbar">
            <div class="px-5 mb-6">
                <h1 class="text-3xl font-bold text-black dark:text-white">Settings</h1>
            </div>

            <div class="mx-4 space-y-6">
                <!-- API Key -->
                <div class="bg-white dark:bg-ios-darkcard rounded-xl p-4 shadow-sm">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-8 h-8 rounded bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white"><i class="fa-solid fa-brain"></i></div>
                        <span class="text-black dark:text-white font-medium">Gemini API Key</span>
                    </div>
                    <input type="password" id="api-key-input" placeholder="Paste Key Here..." class="w-full bg-gray-100 dark:bg-gray-800 text-black dark:text-white rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-500" onchange="saveApiKey(this.value)">
                </div>

                <!-- Theme -->
                <div class="bg-white dark:bg-ios-darkcard rounded-xl p-4 shadow-sm flex justify-between items-center">
                    <span class="text-black dark:text-white font-medium">Dark Mode</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-dark" class="sr-only peer" onchange="toggleTheme()">
                        <div class="w-11 h-6 bg-gray-300 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                    </label>
                </div>

                <!-- Language Input (NEW) -->
                <div class="bg-white dark:bg-ios-darkcard rounded-xl p-4 shadow-sm">
                    <h3 class="text-gray-500 text-xs font-bold uppercase mb-2">Speech Language Code</h3>
                    <p class="text-[10px] text-gray-400 mb-2">Examples: en-US, tr-TR, fr-FR, es-ES, de-DE</p>
                    <input type="text" id="lang-input" placeholder="en-US" class="w-full bg-gray-100 dark:bg-gray-800 text-black dark:text-white rounded-lg p-3 text-lg font-mono outline-none border border-transparent focus:border-ios-blue" onchange="saveSettings()">
                </div>
            </div>
        </div>

        <!-- 4. ACTIVE CALL OVERLAY -->
        <div id="view-call" class="hidden absolute inset-0 bg-gray-900 z-[100] flex flex-col backdrop-blur-3xl bg-opacity-95">
            <div class="flex flex-col items-center mt-16 flex-1 px-6">
                
                <!-- Avatar -->
                <div id="call-avatar" class="w-32 h-32 rounded-full flex items-center justify-center text-4xl text-white shadow-2xl mb-4 border-4 border-gray-800 transition-transform duration-500">
                    <span>AI</span>
                </div>
                
                <h2 id="call-name" class="text-2xl text-white font-semibold">Unknown</h2>
                <p id="call-status-text" class="text-blue-300 text-sm font-bold uppercase tracking-widest mt-2">Connecting...</p>

                <!-- Visualization -->
                <div class="h-16 flex items-center justify-center gap-1 mt-6 w-full">
                    <div class="w-2 bg-blue-500 rounded-full ai-wave-bar ai-wave-paused" style="animation-delay: 0.0s"></div>
                    <div class="w-2 bg-purple-500 rounded-full ai-wave-bar ai-wave-paused" style="animation-delay: 0.1s"></div>
                    <div class="w-2 bg-blue-400 rounded-full ai-wave-bar ai-wave-paused" style="animation-delay: 0.2s"></div>
                    <div class="w-2 bg-purple-400 rounded-full ai-wave-bar ai-wave-paused" style="animation-delay: 0.3s"></div>
                    <div class="w-2 bg-blue-500 rounded-full ai-wave-bar ai-wave-paused" style="animation-delay: 0.4s"></div>
                </div>

                <!-- TAP TO SPEAK BUTTON (Manual Trigger) -->
                <button id="manual-mic-btn" onclick="activateMicManual()" class="mt-8 px-6 py-3 bg-white/10 rounded-full text-white text-sm font-medium border border-white/20 hover:bg-white/20 active:scale-95 transition">
                    <i class="fa-solid fa-microphone mr-2"></i> Tap if Mic Stops
                </button>
            </div>

            <!-- Call Actions -->
            <div class="pb-12 px-12 w-full flex justify-around items-center">
                 <!-- Indicator only, handled by logic -->
                <div id="mic-indicator" class="w-14 h-14 rounded-full bg-gray-700 flex items-center justify-center text-white/50 transition-all duration-300 border-2 border-transparent">
                    <i class="fa-solid fa-microphone"></i>
                </div>

                <button onclick="endCall()" class="w-20 h-20 rounded-full bg-red-500 flex items-center justify-center text-white shadow-lg shadow-red-500/40 hover:scale-105 transition-all active:scale-95">
                    <i class="fa-solid fa-phone-slash text-3xl"></i>
                </button>
                
                <div class="w-14 h-14 rounded-full bg-transparent flex items-center justify-center text-white/30">
                    <i class="fa-solid fa-volume-high"></i>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="absolute bottom-0 w-full h-[80px] bg-white/90 dark:bg-ios-darkcard/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 flex justify-around items-start pt-3 z-40">
            <button onclick="switchView('view-contacts')" class="nav-btn group flex flex-col items-center gap-1 w-16 text-ios-blue">
                <i class="fa-solid fa-user text-xl"></i><span class="text-[10px]">Contacts</span>
            </button>
            <button onclick="switchView('view-messages')" class="nav-btn group flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-comment text-xl"></i><span class="text-[10px]">Messages</span>
            </button>
            <button onclick="switchView('view-settings')" class="nav-btn group flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-gear text-xl"></i><span class="text-[10px]">Settings</span>
            </button>
        </div>
    </div>

    <!-- LOGIC -->
    <script>
        // --- APP CONFIG ---
        const APP = {
            contacts: [
                { id: 1, name: "Sarah", role: "Beginner Tutor", prompt: "You are Sarah, a helpful English tutor. Correct my mistakes.", color: "from-green-400 to-teal-500" },
                { id: 2, name: "Mike", role: "Casual Friend", prompt: "You are Mike. Talk casually.", color: "from-blue-400 to-indigo-600" },
                { id: 3, name: "Dr. Sterling", role: "Professor", prompt: "You are a strict professor. Use big words.", color: "from-purple-500 to-pink-600" }
            ],
            state: {
                isCallActive: false,
                isAiSpeaking: false,
                isMicListening: false,
                currentContact: null,
                transcript: [],
                recognition: null,
                synth: window.speechSynthesis
            },
            settings: {
                apiKey: "",
                darkMode: true,
                lang: "en-US" // Default
            }
        };

        // --- INIT ---
        window.onload = () => {
            // Load saved
            const saved = localStorage.getItem('ai_phone_v3');
            if(saved) {
                const parsed = JSON.parse(saved);
                APP.settings = { ...APP.settings, ...parsed.settings };
                // History logic could go here
            }

            // Apply Settings
            document.getElementById('api-key-input').value = APP.settings.apiKey;
            document.getElementById('toggle-dark').checked = APP.settings.darkMode;
            document.getElementById('lang-input').value = APP.settings.lang;
            applyTheme();
            renderContacts();
            updateClock();
            setInterval(updateClock, 10000);
        };

        function saveData() {
            localStorage.setItem('ai_phone_v3', JSON.stringify({ settings: APP.settings }));
        }

        // --- UI FUNCS ---
        function switchView(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            // Reset nav colors
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-ios-blue');
                b.classList.add('text-gray-400');
            });
            // Set active
            const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.onclick.toString().includes(id));
            if(btn) { btn.classList.remove('text-gray-400'); btn.classList.add('text-ios-blue'); }
        }

        function toggleTheme() {
            APP.settings.darkMode = !APP.settings.darkMode;
            saveData();
            applyTheme();
        }

        function applyTheme() {
            document.documentElement.classList.toggle('dark', APP.settings.darkMode);
        }

        function saveSettings() {
            APP.settings.lang = document.getElementById('lang-input').value.trim() || 'en-US';
            APP.settings.apiKey = document.getElementById('api-key-input').value.trim();
            saveData();
        }

        function saveApiKey(val) { saveSettings(); }

        function renderContacts() {
            const list = document.getElementById('contact-list');
            list.innerHTML = APP.contacts.map(c => `
                <div onclick="startCall(${c.id})" class="flex items-center gap-4 p-4 hover:bg-gray-50 dark:hover:bg-white/5 cursor-pointer transition">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br ${c.color} flex items-center justify-center text-white font-bold text-lg shadow-sm">${c.name[0]}</div>
                    <div class="flex-1">
                        <h3 class="text-black dark:text-white font-semibold">${c.name}</h3>
                        <p class="text-gray-500 text-xs">${c.role}</p>
                    </div>
                    <i class="fa-solid fa-phone text-ios-blue"></i>
                </div>
            `).join('');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // --- CORE CALL LOGIC ---

        function startCall(id) {
            const contact = APP.contacts.find(c => c.id === id);
            APP.state.currentContact = contact;
            APP.state.isCallActive = true;
            APP.state.transcript = [];

            // UI
            document.getElementById('view-call').classList.remove('hidden');
            document.getElementById('call-name').innerText = contact.name;
            document.getElementById('call-avatar').className = `w-32 h-32 rounded-full flex items-center justify-center text-4xl text-white shadow-2xl mb-4 border-4 border-gray-800 transition-transform duration-500 bg-gradient-to-br ${contact.color}`;
            
            // Start Speech
            initSpeechRec();

            // Fake Connection Time then Greeting
            updateStatus("Connecting...");
            setTimeout(() => {
                updateStatus("Connected");
                const greeting = `Hello! This is ${contact.name}.`;
                speakAI(greeting);
            }, 1500);
        }

        function endCall() {
            APP.state.isCallActive = false;
            APP.state.synth.cancel();
            if(APP.state.recognition) APP.state.recognition.stop();
            document.getElementById('view-call').classList.add('hidden');
            
            // Save to messages (simple version)
            const list = document.getElementById('messages-list');
            if(APP.state.transcript.length > 0) {
                const date = new Date().toLocaleTimeString();
                const historyHtml = `
                    <div class="bg-white dark:bg-ios-darkcard p-3 rounded-lg border border-gray-100 dark:border-gray-800">
                        <div class="flex justify-between text-xs font-bold mb-2 text-black dark:text-white">
                            <span>${APP.state.currentContact.name}</span><span>${date}</span>
                        </div>
                        <p class="text-xs text-gray-500">${APP.state.transcript.length} messages</p>
                    </div>`;
                list.insertAdjacentHTML('afterbegin', historyHtml);
            }
        }

        function updateStatus(text) {
            document.getElementById('call-status-text').innerText = text;
        }

        // --- SPEECH RECOGNITION (FIXED) ---

        function initSpeechRec() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Speech API not supported. Please use Chrome.");
                return;
            }
            
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            APP.state.recognition = new SpeechRec();
            APP.state.recognition.lang = APP.settings.lang;
            APP.state.recognition.continuous = false; // Turn-based for reliability
            APP.state.recognition.interimResults = false;

            APP.state.recognition.onstart = () => {
                APP.state.isMicListening = true;
                updateStatus("Listening... (Speak Now)");
                document.getElementById('mic-indicator').classList.add('mic-active');
            };

            APP.state.recognition.onend = () => {
                APP.state.isMicListening = false;
                document.getElementById('mic-indicator').classList.remove('mic-active');
                
                // CRITICAL LOOP: If call active & AI not speaking, restart mic
                if (APP.state.isCallActive && !APP.state.isAiSpeaking) {
                    // Small delay to prevent CPU thrashing if mic error loop
                    setTimeout(() => {
                        if(APP.state.isCallActive && !APP.state.isAiSpeaking && !APP.state.isMicListening) {
                            try { APP.state.recognition.start(); } catch(e){}
                        }
                    }, 100);
                }
            };

            APP.state.recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                if(text.trim()) {
                    APP.state.transcript.push({role: 'user', text});
                    handleUserSpeech(text);
                }
            };

            APP.state.recognition.onerror = (event) => {
                console.log("Mic Error:", event.error);
                if(event.error === 'not-allowed') {
                    alert("Microphone access blocked! Please allow permissions in browser settings.");
                    endCall();
                }
            };
        }

        function activateMicManual() {
            // Force start if stuck
            if(APP.state.recognition && !APP.state.isMicListening) {
                try { APP.state.recognition.start(); } catch(e){}
            }
        }

        async function handleUserSpeech(text) {
            updateStatus("Thinking...");
            
            // Get AI Response
            let responseText = "";
            if(APP.settings.apiKey) {
                responseText = await fetchGemini(text);
            } else {
                await new Promise(r => setTimeout(r, 800)); // Fake delay
                responseText = "I heard you say: " + text + ". (Add API Key in Settings for real AI)";
            }
            
            speakAI(responseText);
        }

        // --- TTS ---

        function speakAI(text) {
            APP.state.isAiSpeaking = true;
            APP.state.transcript.push({role: 'ai', text});
            updateStatus("Speaking...");
            
            // Visuals
            document.querySelectorAll('.ai-wave-bar').forEach(b => b.classList.remove('ai-wave-paused'));
            
            // Stop mic before speaking
            if(APP.state.isMicListening) APP.state.recognition.stop();
            APP.state.synth.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = APP.settings.lang;
            u.rate = 1.0;
            
            u.onend = () => {
                APP.state.isAiSpeaking = false;
                document.querySelectorAll('.ai-wave-bar').forEach(b => b.classList.add('ai-wave-paused'));
                
                // Resume Mic
                if(APP.state.isCallActive) {
                    try { APP.state.recognition.start(); } catch(e){}
                }
            };

            APP.state.synth.speak(u);
        }

        // --- GEMINI API ---
        async function fetchGemini(userText) {
            const hist = APP.state.transcript.map(t => `${t.role}: ${t.text}`).join('\n');
            const prompt = `System: ${APP.state.currentContact.prompt}. Language: ${APP.settings.lang}. Keep response short (1-2 sentences).
            Conversation:
            ${hist}
            User: ${userText}
            AI:`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${APP.settings.apiKey}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates[0].content.parts[0].text;
            } catch(e) {
                return "Error connecting to AI. Please check API Key.";
            }
        }

        function clearHistory() {
            document.getElementById('messages-list').innerHTML = '';
        }

    </script>
</body>
</html>
