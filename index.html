<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Linguist OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: { blue: '#007AFF', gray: '#8E8E93', bg: '#F2F2F7', darkbg: '#000000', card: '#1C1C1E' }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern Mobile Reset */
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Mic Active Animation */
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: ripple 1.5s infinite;
            background-color: #ef4444 !important; /* Red */
            color: white !important;
            border-color: #ef4444 !important;
            transform: scale(1.1);
        }

        /* Avatar Float */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .avatar-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<!-- Use h-dvh for better mobile browser support (address bar handling) -->
<body class="bg-gray-900 h-[100dvh] w-screen flex items-center justify-center font-sans overflow-hidden select-none">

    <!-- PHONE CONTAINER -->
    <!-- On desktop: Fixed width/height. On mobile: Full width/height -->
    <div class="relative w-full h-full sm:w-[375px] sm:h-[812px] bg-ios-bg dark:bg-black sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col border-0 sm:border-[6px] border-gray-800">
        
        <!-- STATUS BAR -->
        <div class="h-12 min-h-[48px] w-full flex justify-between items-center px-6 text-xs font-bold z-50 text-black dark:text-white bg-white/50 dark:bg-black/50 backdrop-blur-md sticky top-0">
            <span id="clock">12:00</span>
            <div class="flex gap-2 items-center">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-lg"></i>
            </div>
        </div>

        <!-- ======================= CONTENT AREA (Flex Grow) ======================= -->
        <div class="flex-1 relative overflow-hidden w-full">

            <!-- 1. CONTACTS VIEW -->
            <div id="view-contacts" class="absolute inset-0 overflow-y-auto no-scrollbar pt-4 pb-24 px-4">
                <div class="mb-4">
                    <h1 class="text-3xl font-bold text-black dark:text-white mb-1">Contacts</h1>
                    <p class="text-gray-500 text-sm">Tap a contact to call</p>
                </div>
                <div class="bg-white dark:bg-ios-card rounded-2xl overflow-hidden shadow-sm divide-y divide-gray-100 dark:divide-gray-800" id="contact-list">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- 2. MESSAGES VIEW -->
            <div id="view-messages" class="hidden absolute inset-0 overflow-y-auto no-scrollbar pt-4 pb-24 px-4">
                <div class="flex justify-between items-end mb-4">
                    <h1 class="text-3xl font-bold text-black dark:text-white">Messages</h1>
                    <button onclick="clearHistory()" class="text-ios-blue text-sm font-semibold px-2 py-1">Clear</button>
                </div>
                <div id="messages-list" class="space-y-3 pb-4">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- 3. SETTINGS VIEW -->
            <div id="view-settings" class="hidden absolute inset-0 overflow-y-auto no-scrollbar pt-4 pb-24 px-4">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-black dark:text-white">Settings</h1>
                </div>
                <div class="space-y-4">
                    <!-- API Key -->
                    <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm">
                        <div class="flex items-center gap-3 mb-2">
                            <i class="fa-solid fa-key text-yellow-500"></i>
                            <span class="text-black dark:text-white font-medium">Gemini API Key</span>
                        </div>
                        <input type="password" id="api-key-input" placeholder="Paste Key Here" class="w-full bg-gray-100 dark:bg-gray-800 text-black dark:text-white rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-ios-blue" onchange="saveSettings()">
                    </div>
                    
                    <!-- Language -->
                    <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm">
                        <div class="flex items-center gap-3 mb-2">
                            <i class="fa-solid fa-language text-blue-500"></i>
                            <span class="text-black dark:text-white font-medium">Language Code</span>
                        </div>
                        <input type="text" id="lang-input" placeholder="en-US" class="w-full bg-gray-100 dark:bg-gray-800 text-black dark:text-white rounded-lg p-3 text-sm outline-none font-mono uppercase" onchange="saveSettings()">
                        <p class="text-[10px] text-gray-400 mt-2">Try: en-US, es-ES, fr-FR, tr-TR, ja-JP</p>
                    </div>

                    <!-- Theme -->
                    <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm flex justify-between items-center">
                        <span class="text-black dark:text-white font-medium">Dark Mode</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-dark" class="sr-only peer" onchange="toggleTheme()">
                            <div class="w-11 h-6 bg-gray-300 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 4. CALL OVERLAY (Full Screen) -->
            <div id="view-call" class="hidden absolute inset-0 bg-gray-900 z-[100] flex flex-col">
                <!-- Header -->
                <div class="mt-8 flex flex-col items-center">
                    <h2 id="call-name" class="text-2xl text-white font-semibold">Contact</h2>
                    <p id="call-status" class="text-blue-400 text-xs font-bold uppercase tracking-widest mt-1">Ready</p>
                </div>

                <!-- Avatar Area -->
                <div class="flex-1 flex items-center justify-center relative w-full">
                    <!-- Rings -->
                    <div class="absolute w-64 h-64 border border-white/5 rounded-full animate-[pulse_4s_infinite]"></div>
                    <div class="absolute w-48 h-48 border border-white/10 rounded-full animate-[pulse_3s_infinite]"></div>
                    
                    <!-- Avatar -->
                    <div id="call-avatar" class="w-32 h-32 rounded-full flex items-center justify-center text-4xl text-white shadow-[0_0_40px_rgba(0,0,0,0.5)] border-4 border-gray-800 z-10 avatar-float transition-all duration-500">
                        <span>AI</span>
                    </div>
                </div>

                <!-- Interaction Area (Bottom Half) -->
                <div class="w-full px-8 pb-10 flex flex-col items-center gap-8">
                    
                    <!-- Main Mic Button -->
                    <div class="relative">
                        <button id="mic-btn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-gray-700 text-white shadow-lg flex items-center justify-center text-2xl transition-all duration-200 border border-white/10 active:scale-95 z-20 relative">
                            <i id="mic-icon" class="fa-solid fa-microphone"></i>
                        </button>
                        <p id="mic-hint" class="text-white/30 text-xs text-center mt-3 absolute w-40 -left-10">Tap to Speak</p>
                    </div>

                    <!-- Controls Row -->
                    <div class="w-full flex justify-between items-center px-6">
                        <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center text-white/50 backdrop-blur-sm">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                        
                        <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-white shadow-lg shadow-red-500/40 active:scale-95 transition-all">
                            <i class="fa-solid fa-phone-slash text-2xl"></i>
                        </button>
                        
                        <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center text-white/50 backdrop-blur-sm">
                            <i class="fa-solid fa-keyboard"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="h-[80px] min-h-[80px] w-full bg-white/90 dark:bg-[#1C1C1E]/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 flex justify-around items-start pt-3 z-50 pb-safe">
            <button onclick="switchView('view-contacts')" class="nav-btn group flex flex-col items-center gap-1 w-16 text-ios-blue">
                <i class="fa-solid fa-user text-xl"></i>
                <span class="text-[10px] font-medium">Contacts</span>
            </button>
            <button onclick="switchView('view-messages')" class="nav-btn group flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-comment text-xl"></i>
                <span class="text-[10px] font-medium">Chat</span>
            </button>
            <button onclick="switchView('view-settings')" class="nav-btn group flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-gear text-xl"></i>
                <span class="text-[10px] font-medium">Settings</span>
            </button>
        </div>

    </div>

    <!-- LOGIC -->
    <script>
        const APP = {
            contacts: [
                { id: 1, name: "Sarah", role: "Beginner Tutor", prompt: "You are Sarah, a kind beginner English tutor. Correct grammar gently.", color: "from-emerald-400 to-teal-600" },
                { id: 2, name: "Mike", role: "Casual Friend", prompt: "You are Mike. Talk casually using slang.", color: "from-blue-400 to-indigo-600" },
                { id: 3, name: "Dr. Sterling", role: "Professor", prompt: "You are a strict professor. Use complex vocabulary.", color: "from-purple-500 to-pink-600" }
            ],
            state: {
                currentContact: null,
                isRecording: false,
                isAiSpeaking: false,
                transcript: [],
                recognition: null,
                synth: window.speechSynthesis
            },
            settings: {
                apiKey: "",
                darkMode: true,
                lang: "en-US"
            }
        };

        // --- INIT ---
        window.onload = () => {
            const saved = localStorage.getItem('ai_phone_v4');
            if(saved) APP.settings = { ...APP.settings, ...JSON.parse(saved).settings };
            
            // Apply UI
            document.getElementById('api-key-input').value = APP.settings.apiKey;
            document.getElementById('lang-input').value = APP.settings.lang;
            document.getElementById('toggle-dark').checked = APP.settings.darkMode;
            applyTheme();
            renderContacts();
            updateClock();
            setInterval(updateClock, 10000);
            
            // Setup Speech
            initSpeech();
        };

        function saveData() {
            localStorage.setItem('ai_phone_v4', JSON.stringify({ settings: APP.settings }));
        }

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        // --- NAVIGATION ---
        function switchView(id) {
            // Hide all views
            ['view-contacts', 'view-messages', 'view-settings'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            
            // Nav Styling
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-ios-blue');
                b.classList.add('text-gray-400');
            });
            const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.onclick.toString().includes(id));
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('text-ios-blue');
            }
        }

        function renderContacts() {
            const list = document.getElementById('contact-list');
            list.innerHTML = APP.contacts.map(c => `
                <div onclick="startCall(${c.id})" class="flex items-center gap-4 p-4 hover:bg-gray-50 dark:hover:bg-white/5 active:bg-gray-100 transition cursor-pointer">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br ${c.color} flex items-center justify-center text-white font-bold text-lg shadow-sm shrink-0">
                        ${c.name[0]}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-black dark:text-white font-semibold truncate">${c.name}</h3>
                        <p class="text-gray-500 text-xs truncate">${c.role}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            `).join('');
        }

        function toggleTheme() {
            APP.settings.darkMode = !APP.settings.darkMode;
            saveData();
            applyTheme();
        }

        function applyTheme() {
            document.documentElement.classList.toggle('dark', APP.settings.darkMode);
        }

        function saveSettings() {
            APP.settings.apiKey = document.getElementById('api-key-input').value.trim();
            APP.settings.lang = document.getElementById('lang-input').value.trim() || 'en-US';
            saveData();
            // Re-init speech with new language
            initSpeech(); 
        }

        // --- CALL LOGIC ---
        function startCall(id) {
            const contact = APP.contacts.find(c => c.id === id);
            APP.state.currentContact = contact;
            APP.state.transcript = [];
            
            // Update UI
            document.getElementById('view-call').classList.remove('hidden');
            document.getElementById('call-name').innerText = contact.name;
            document.getElementById('call-avatar').className = `w-32 h-32 rounded-full flex items-center justify-center text-4xl text-white shadow-lg border-4 border-gray-800 z-10 avatar-float transition-all bg-gradient-to-br ${contact.color}`;
            
            updateMicUI('idle');
            
            // Greeting
            setTimeout(() => {
                const greeting = `Hello, this is ${contact.name}.`;
                speakAI(greeting);
            }, 800);
        }

        function endCall() {
            APP.state.synth.cancel();
            if(APP.state.isRecording) APP.state.recognition.stop();
            document.getElementById('view-call').classList.add('hidden');
            saveTranscript();
        }

        // --- MICROPHONE LOGIC (MANUAL TOGGLE) ---
        function initSpeech() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Browser not supported. Use Chrome.");
                return;
            }
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            APP.state.recognition = new SpeechRec();
            APP.state.recognition.lang = APP.settings.lang;
            APP.state.recognition.continuous = false; 
            APP.state.recognition.interimResults = false;

            APP.state.recognition.onstart = () => {
                APP.state.isRecording = true;
                updateMicUI('listening');
            };

            APP.state.recognition.onend = () => {
                APP.state.isRecording = false;
                // If we didn't get results yet, just go back to idle
                if(!APP.state.processing) updateMicUI('idle');
            };

            APP.state.recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                if(text.trim()) {
                    handleUserSpeech(text);
                }
            };
            
            APP.state.recognition.onerror = (e) => {
                console.error(e);
                updateMicUI('idle');
                if(e.error === 'not-allowed') alert("Please allow microphone access.");
            };
        }

        function toggleMic() {
            if(APP.state.isAiSpeaking) {
                APP.state.synth.cancel(); // Interrupt AI
                APP.state.isAiSpeaking = false;
            }

            if(APP.state.isRecording) {
                // User wants to stop manually
                APP.state.recognition.stop();
            } else {
                // User wants to speak
                try {
                    APP.state.recognition.start();
                } catch(e) {
                    console.log("Mic restart error", e);
                }
            }
        }

        function updateMicUI(state) {
            const btn = document.getElementById('mic-btn');
            const hint = document.getElementById('mic-hint');
            const status = document.getElementById('call-status');

            if(state === 'listening') {
                btn.classList.add('mic-active');
                btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
                hint.innerText = "Tap to Send";
                status.innerText = "Listening...";
                status.className = "text-red-400 text-xs font-bold uppercase tracking-widest mt-1";
            } else if (state === 'processing') {
                btn.classList.remove('mic-active');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                hint.innerText = "Processing...";
                status.innerText = "Thinking...";
                status.className = "text-yellow-400 text-xs font-bold uppercase tracking-widest mt-1";
            } else {
                // Idle
                btn.classList.remove('mic-active');
                btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                hint.innerText = "Tap to Speak";
                status.innerText = "Your Turn";
                status.className = "text-blue-400 text-xs font-bold uppercase tracking-widest mt-1";
            }
        }

        async function handleUserSpeech(text) {
            APP.state.processing = true;
            updateMicUI('processing');
            APP.state.transcript.push({role:'user', text});

            let responseText = "I heard: " + text + ". (No API Key)";
            
            if(APP.settings.apiKey) {
                responseText = await fetchGemini(text);
            } else {
                await new Promise(r => setTimeout(r, 1000));
            }

            APP.state.processing = false;
            speakAI(responseText);
        }

        // --- AI & TTS ---
        function speakAI(text) {
            APP.state.isAiSpeaking = true;
            APP.state.transcript.push({role:'ai', text});
            updateMicUI('idle'); // Back to idle so user can listen
            document.getElementById('call-status').innerText = "Speaking...";
            
            const u = new SpeechSynthesisUtterance(text);
            u.lang = APP.settings.lang;
            
            u.onend = () => {
                APP.state.isAiSpeaking = false;
                document.getElementById('call-status').innerText = "Your Turn";
            };

            APP.state.synth.speak(u);
        }

        async function fetchGemini(input) {
            const historyText = APP.state.transcript.slice(-6).map(t => `${t.role}: ${t.text}`).join('\n');
            const prompt = `
                System: ${APP.state.currentContact.prompt}
                Language: ${APP.settings.lang}
                Conversation History:
                ${historyText}
                User: ${input}
                Response (Keep it conversational and concise):
            `;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${APP.settings.apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates[0].content.parts[0].text;
            } catch(e) {
                return "Error connecting to AI.";
            }
        }

        // --- HISTORY ---
        function saveTranscript() {
            if(APP.state.transcript.length === 0) return;
            const container = document.getElementById('messages-list');
            const div = document.createElement('div');
            div.className = "bg-white dark:bg-ios-card p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800";
            div.innerHTML = `
                <div class="flex justify-between mb-2">
                    <span class="font-bold text-black dark:text-white">${APP.state.currentContact.name}</span>
                    <span class="text-xs text-gray-500">${new Date().toLocaleTimeString()}</span>
                </div>
                <p class="text-xs text-gray-400">${APP.state.transcript.length} lines exchanged.</p>
            `;
            container.prepend(div);
        }
        
        function clearHistory() {
            document.getElementById('messages-list').innerHTML = '';
        }

    </script>
</body>
</html>
